name: Deploy Socket Server

# 前端由 Vercel 部署；這裡只建置 Socket.IO 服務，僅在其相依檔案變動時觸發
on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'models/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - '.github/workflows/cloud-run.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

    - name: code checkout
      uses: actions/checkout@v2

    - name: install the gcloud cli
      uses: google-github-actions/setup-gcloud@v0
      with:
        project_id: ${{ secrets.GOOGLE_PROJECT }}
        service_account_key: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        export_default_credentials: true

    - name: build and push the docker image
      env:
        GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      run: |
        gcloud auth configure-docker asia-east1-docker.pkg.dev
        docker build -t asia-east1-docker.pkg.dev/$GOOGLE_PROJECT/prod/webapp:latest .
        docker push asia-east1-docker.pkg.dev/$GOOGLE_PROJECT/prod/webapp:latest

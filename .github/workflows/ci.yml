name: CI

# PR 合併前檢查格式、lint、型別與單元測試；E2E（Playwright + Firestore Emulator）需要 Java，暫不在 CI 跑
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# 同一個分支有新的 push 時，取消還在跑的舊檢查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package.json 的 engines 要求 npm >= 11.10（.npmrc 的 min-release-age、strict-allow-scripts 需要）
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run
